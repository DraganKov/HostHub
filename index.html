.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.stat{font:700 13px Barlow,sans-serif;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--mute)}

.stat.good{color:var(--od);border-color:var(--od)}.stat.bad{color:var(--tip);border-color:var(--tip)}
.evt{font-size:18px;text-align:left}.ev .row{margin-top:6px}.note-box{border-left:3px solid var(--tip);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:0 4px 4px 0;overflow-wrap:anywhere}
.regrow{border-top:1px solid var(--line);padding-top:6px}.fcard{width:100%;text-align:left}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}.dow{text-align:center;color:var(--mute);font-size:13px}
.day{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:500 14px Barlow,sans-serif;cursor:pointer;padding:0}
.day.off{background:transparent;border-color:transparent;cursor:default}.day.today{border-color:var(--tip)}.day.has{font-weight:700}.day.sel{background:var(--od);color:var(--onod);border-color:var(--od)}
.dot{position:absolute;right:3px;bottom:2px;font-size:11px;background:var(--tip);color:var(--ontip);border-radius:999px;min-width:16px;line-height:16px;text-align:center;padding:0 3px}
.mapbox{height:360px;border:1px solid var(--line);border-radius:6px;background:var(--card);display:grid;place-items:center;color:var(--mute)}
.mapbox.leaflet-container{display:block}.legend{margin:8px 0}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.featrow select{width:auto;flex:1 1 140px;margin:0}.featrow input{flex:2 1 140px;margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.big{background:var(--bg);border-radius:6px;padding:8px}.big small{display:block;color:var(--mute)}.big b{font:700 18px Barlow,sans-serif}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th,.tbl td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}.pos{color:var(--od)}.neg{color:var(--tip)}.ledg{align-items:center}

.shell{display:block}
.acct{padding:10px 0 6px;display:flex;flex-direction:column;gap:6px}
.acct .me{font:700 16px/1.2 Barlow,sans-serif;display:flex;flex-direction:column}.acct .me small{color:var(--mute);font-weight:500}
.acct .row2{display:flex;gap:6px;flex-wrap:wrap}
@media(min-width:800px){
 .shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
 .shell.solo{grid-template-columns:minmax(0,1fr)}
 .nav{top:0;height:100vh;overflow-y:auto;border-bottom:0;border-right:1px solid var(--line)}
 .nav .in{max-width:none;padding:8px 16px 24px}
 .brand{padding:14px 0 6px;font-size:24px}
 .tabs{flex-direction:column;overflow:visible;gap:2px;margin-top:10px}
 .tab{text-align:left;border:0;border-left:3px solid transparent;border-radius:6px;padding:10px 12px;width:100%;display:flex;justify-content:space-between;align-items:center}
 .tab[aria-current="page"]{background:var(--bg);border-left-color:var(--tip)}
 .wrap{max-width:760px;margin:0;padding:22px 28px 56px;width:100%}
 .shell.solo .wrap{margin:0 auto}
}
.tacmap{position:relative}.mapw{position:relative}.tacmap .mapbox{height:min(68vh,620px);min-height:380px}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.mapbar .chip[aria-pressed="true"]{background:var(--tip);color:var(--ontip)}.minfo{font-size:14px;color:var(--mute)}
.mapro{position:absolute;left:110px;bottom:8px;z-index:500;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:500 12px/1.5 ui-monospace,monospace;max-width:calc(100% - 16px);pointer-events:none}
.tacmap.full{position:fixed;inset:0;z-index:2000;background:var(--bg);padding:8px;display:flex;flex-direction:column}.tacmap.full .mapw{flex:1;min-height:0}.tacmap.full .mapbox{height:100%;min-height:0}
body.noscroll{overflow:hidden}.mapbox.measuring{cursor:crosshair}.mapbox.measuring .leaflet-interactive{pointer-events:none}
.pin span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 13px/1 sans-serif;box-shadow:0 1px 4px #0007}
.msym svg{filter:drop-shadow(0 1px 2px #0008)}.maplbl{font:600 12px sans-serif;padding:1px 5px}

/* ===== Social-style look: tonal surfaces, rounded cards, icon sidebar, reaction bar, thumbnail tiles ===== */
:root{--bg:#f0f2f5;--card:#fff;--line:#e4e6eb;--side:#fff;--hov:#e8eaee;--shadow:0 1px 2px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1f22;--card:#2b2d31;--line:#3a3c42;--side:#17181a;--hov:#35373c;--shadow:0 1px 2px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1e1f22;--card:#2b2d31;--line:#3a3c42;--side:#17181a;--hov:#35373c;--shadow:0 1px 2px rgba(0,0,0,.5)}
body{font-family:Barlow,system-ui,sans-serif}
.card{border:0;border-radius:12px;box-shadow:var(--shadow);padding:16px}
input,textarea,select{border:1px solid transparent;background:var(--bg);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--tip);outline:0}
textarea{border-radius:14px;min-height:64px}
.btn{border-radius:8px;padding:9px 18px}
.btn.alt,.chip{background:var(--bg);border:0}
.chip{border-radius:8px;padding:6px 14px;font-weight:600}.chip:hover{background:var(--hov)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.filters{padding:2px 0 14px}
.tag{border:0;background:var(--bg);color:var(--mute);border-radius:999px;padding:1px 10px;font-weight:600}
.av{width:42px;height:42px;background:linear-gradient(135deg,var(--tip),#b8350a);color:#fff}
/* Sidebar */
.nav{background:var(--side)}
.nav .in{display:flex;flex-direction:column}
.tab{border-radius:8px;display:flex;align-items:center;gap:12px;border-width:0;color:var(--mute);font-weight:600}
.tab:hover{background:var(--hov);color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--hov)}
.tab .ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"] .ico{stroke:var(--tip)}
.tab .tl{flex:1;text-align:left}
.acct{background:var(--bg);border-radius:10px;padding:10px 12px;margin:6px 0}
.brand{letter-spacing:-.3px}.acct .chip{background:var(--card)}
/* Feed: post reaction bar */
.post header{align-items:flex-start}
.acts{border-top:1px solid var(--line);padding-top:4px;margin-top:10px;gap:4px;align-items:center}
.acts .act{flex:1;border-radius:8px;padding:8px;text-align:center}.acts .act:hover{background:var(--hov)}
.acts .vote{flex:1;justify-content:center}
.vb{border:0;background:var(--bg);border-radius:8px;width:34px;height:30px}.vb:hover{background:var(--hov)}
.body{font-size:17px;line-height:1.45}
/* Events: date tile like a video thumbnail */
.evtop{display:flex;gap:14px;align-items:flex-start}.evmain{min-width:0;flex:1}
.dtile{flex:none;width:64px;height:64px;border-radius:12px;background:linear-gradient(160deg,var(--tip),#a02f08);color:#fff;display:grid;place-content:center;text-align:center;line-height:1}
.dtile b{font:700 26px Barlow,sans-serif}.dtile small{font:600 12px Barlow,sans-serif;text-transform:none;opacity:.9;margin-top:2px}
.ev{padding:14px}.ev .row{margin-top:10px}
.stat{border:0;background:var(--bg);border-radius:999px;padding:1px 10px;font-weight:600}
.stat.good{background:rgba(47,158,68,.16);color:#2f9e44}.stat.bad{background:rgba(224,49,49,.16);color:#e03131}
/* Fields: thumbnail tile + title/meta like a video row */
.fcard{display:flex;gap:14px;align-items:center}
.fthumb{flex:none;width:96px;height:60px;border-radius:10px;background:linear-gradient(135deg,#2f6b3a,#16331d);color:#fff;display:grid;place-items:center;font:700 26px Barlow,sans-serif}
.fcard .who{min-width:0}
/* Mobile: bottom tab bar */
@media(max-width:799px){
 .nav{position:sticky;top:env(safe-area-inset-top,0px)}
 .nav .in{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 16px}
 .brand{padding:6px 0}.acct{flex-direction:row;margin:0 0 0 auto;padding:4px 8px;background:none}
 .acct .me small{display:none}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:flex-start;gap:0;overflow-x:auto;scrollbar-width:none}
 .tab{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;flex:1 0 auto;min-width:68px;position:relative;border-radius:8px}
 .tab .tl{flex:none;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 .tab[aria-current="page"]{background:none}
 .tab[aria-current="page"] .tl{color:var(--tip)}
 .tab .badge{position:absolute;top:0;left:55%;margin:0}
 .wrap{padding-bottom:88px}
}
@media(min-width:800px){
 .nav .in{min-height:100vh;padding-bottom:16px}
 .acct{order:3;margin-top:auto}
 .tabs{margin-top:8px}
 .tab{border-left:0;padding:10px 12px}
 .wrap{max-width:700px;margin:0 auto}
 .shell.solo .wrap{margin:0 auto}
}

/* Collapsible sidebar: an icon rail that slides open over the page on hover or keyboard focus (devices with a mouse only). */
.accmini{display:none}
@media (min-width:800px) and (hover:hover){
 .shell:not(.solo){grid-template-columns:68px minmax(0,1fr)}
 .nav{overflow:visible;z-index:30;border-right:0}
 .nav .in{position:absolute;left:0;top:0;bottom:0;width:68px;min-height:0;padding:8px 10px 14px;overflow:hidden;background:var(--side);border-right:1px solid var(--line);
  transition:width .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease}
 .nav:hover .in,.nav:focus-within .in{width:240px;padding:8px 16px 14px;box-shadow:8px 0 24px rgba(0,0,0,.18)}
 .brand{display:flex;align-items:center;white-space:nowrap;height:46px;padding:0}
 .brand .bm{flex:none;width:48px;font-size:20px;text-align:center;color:var(--tip)}
 .brand .bf{opacity:0;transition:opacity .15s ease;margin-left:-4px}
 .tab{padding:10px 13px;white-space:nowrap}
 .tab .tl,.tab .badge{transition:opacity .15s ease}
 .tab .badge{position:absolute;top:4px;left:30px;margin:0}.tab{position:relative}
 .nav .in:not(:hover):not(:focus-within) .tl,.nav:not(:hover):not(:focus-within) .in .bf{opacity:0}
 .nav:hover .bf,.nav:focus-within .bf{opacity:1;transition-delay:.08s}
 .nav:hover .tab .badge,.nav:focus-within .tab .badge{position:static;margin-left:4px}
 .accwrap{position:relative;white-space:nowrap}
 .accwrap>*:not(.accmini){display:none}
 .accwrap{background:none;padding:0}
 .accmini{display:grid;place-items:center;width:48px;height:48px;background:none;border:0;padding:0;cursor:pointer;color:var(--mute);border-radius:10px}
 .accmini:hover{background:var(--hov)}.accmini .av{width:36px;height:36px;font-size:15px}.accmini .ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
 .nav:hover .accwrap,.nav:focus-within .accwrap{background:var(--bg);padding:10px 12px}
 .nav:hover .accwrap>*:not(.accmini),.nav:focus-within .accwrap>*:not(.accmini){display:flex}
 .nav:hover .accmini,.nav:focus-within .accmini{display:none}
 .nav:hover .acct .me,.nav:focus-within .acct .me{display:flex}
}
@media (prefers-reduced-motion:reduce){.nav .in,.brand .bf,.tab .tl{transition:none!important}}

/* Content column fills the page width in any orientation. */
.wrap,.shell.solo .wrap{max-width:none;width:100%;margin:0;padding-left:clamp(14px,3vw,40px);padding-right:clamp(14px,3vw,40px)}
.shell.solo .wrap{max-width:560px;margin:0 auto}

/* Account block sits at the very top of the sidebar, like Discord's user panel. */
@media(min-width:800px){.acct{order:0;margin-top:0}.brand{order:1}.tabs{order:2}}
@media(min-width:800px) and (hover:hover){.nav .in{padding-top:10px}.accwrap{margin:0 0 4px}.brand{height:38px;margin-top:2px}}
@media(max-width:799px){.acct{order:0;margin:0}.brand{order:1;margin-left:auto}.nav .in{flex-wrap:nowrap}.acct .row2{flex-wrap:nowrap}.acct .chip{background:var(--bg)}.brand{white-space:nowrap;font-size:19px}}
.brand .bm{display:none}@media (min-width:800px) and (hover:hover){.brand .bm{display:block}}

/* Expanded sidebar shows the full name instead of the AH mark (they cross-fade). */
@media (min-width:800px) and (hover:hover){
 .brand{position:relative}
 .brand .bm{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;justify-content:center;transition:opacity .15s ease}
 .brand .bf{margin-left:0;padding-left:12px}
 .nav:hover .brand .bm,.nav:focus-within .brand .bm{opacity:0}
}

/* Account and brand are one combined panel: a compact tile in the rail, the full card when open. */
.hdr{display:contents}
@media(min-width:800px){
 .hdr{display:block;background:var(--bg);border-radius:12px;padding:6px;margin-bottom:8px}
 .hdr .acct{background:none;padding:2px 6px;margin:0;border-radius:0}
 .hdr .brand{border-top:1px solid var(--line);margin:4px 0 0;padding:4px 0 0;height:auto;min-height:32px}
}
@media (min-width:800px) and (hover:hover){
 .hdr{padding:2px;margin-bottom:6px}
 .hdr .accwrap,.nav:hover .hdr .accwrap,.nav:focus-within .hdr .accwrap{background:none;padding:0;margin:0}
 .nav:hover .hdr,.nav:focus-within .hdr{padding:8px 6px}
 .nav:hover .hdr .accwrap,.nav:focus-within .hdr .accwrap{padding:2px 6px}
 .hdr .brand{height:30px;min-height:0;margin-top:0;padding-top:0;border-top-color:transparent}
 .nav:hover .hdr .brand,.nav:focus-within .hdr .brand{height:auto;min-height:32px;margin-top:6px;padding-top:8px;border-top-color:var(--line)}
 .hdr .brand .bm{height:30px}
 .nav:hover .hdr .brand .bm,.nav:focus-within .hdr .brand .bm{height:100%}
 .hdr .brand .bf{padding-left:6px}
}
</style>
</head>
<body>
