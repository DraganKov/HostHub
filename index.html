<!DOCTYPE html>
<html lang="en">
<head>

<title>Airsoft Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#16181b;--card:#1f2327;--ink:#e8e9eb;--mute:#9aa0a8;--line:#32373d;--od:#aeb8c6;--onod:#14181d;--tip:#ff7a3d;--ontip:#1a0d00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}

.wrap{padding:18px 16px 56px}
.brand{font:700 22px/1 Barlow,sans-serif;padding:12px 0 4px}.brand span{color:var(--tip)}
.tabs{display:flex;gap:2px;overflow-x:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}

textarea{min-height:84px;resize:vertical;margin-bottom:0}

.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font:500 14px Barlow,sans-serif;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--od);border-color:var(--od);color:var(--onod)}
.sp{flex:1}.count{color:var(--mute);font-size:14px}.count.over{color:var(--tip);font-weight:600}
.btn{background:var(--tip);color:var(--ontip);border:0;border-radius:4px;padding:8px 18px;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.post header,.note,.thr,.prof{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--od);color:var(--onod);display:grid;place-items:center;font:600 16px Barlow,sans-serif;flex:none}
.prof .av{width:64px;height:64px;font-size:28px}
.who{font-weight:600;line-height:1.2}.who small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.link{background:none;border:0;padding:0;font:600 16px Barlow,sans-serif;color:inherit;cursor:pointer;text-align:left}.link:hover{text-decoration:underline}
.tag{font-size:13px;color:var(--od);border:1px solid var(--od);border-radius:3px;padding:0 6px}
.body{margin:10px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.vote{display:inline-flex;align-items:center;gap:6px}.vb{background:none;border:1px solid var(--line);border-radius:4px;color:var(--mute);width:32px;height:28px;cursor:pointer;font-size:13px}.vb[aria-pressed="true"]{background:var(--tip);border-color:var(--tip);color:var(--ontip)}.score{min-width:1.5em;text-align:center}
.acts{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.act{background:none;border:0;color:var(--mute);font:500 14px Barlow,sans-serif;cursor:pointer;padding:4px 0}
.act[aria-pressed="true"]{color:var(--tip);font-weight:600}
.comments{margin-top:8px;border-left:2px solid var(--line);padding-left:12px}.cm{font-size:15px;margin:6px 0}
.cf{display:flex;gap:8px}.cf input{margin:0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.thr{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.note.new{border-left:4px solid var(--tip)}
.bub{width:fit-content;max-width:80%;padding:8px 12px;border-radius:12px;margin:6px 0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line)}
.bub.me{margin-left:auto;background:var(--od);border-color:var(--od);color:var(--onod)}
.err{color:var(--tip);font-weight:600;min-height:1.5em;margin:4px 0}
.fine{color:var(--mute);font-size:14px}
</style>
</head>

/* Realtime: any change in Supabase re-pulls the data; only Alerts and Messages redraw so typing is never interrupted. */
